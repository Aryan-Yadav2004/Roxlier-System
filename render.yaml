# render.yaml — Render.com Infrastructure as Code
# This file lets Render auto-detect your services when you connect the repo.
# Docs: https://render.com/docs/render-yaml-reference

services:
  # ─────────────────────────────────────────────
  # BACKEND — Express.js Web Service
  # ─────────────────────────────────────────────
  - type: web
    name: roxlier-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        sync: false          # Set to your frontend Render URL after deploying frontend

  # ─────────────────────────────────────────────
  # FRONTEND — React/Vite Static Site
  # ─────────────────────────────────────────────
  - type: web
    name: roxlier-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # Required for React Router (SPA)
    envVars:
      - key: VITE_API_URL
        sync: false                # Set to your backend Render URL after deploying backend
